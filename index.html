<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<title>LAAS Screen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #stage { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; background: #000; }
  #stage video, #stage img {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity .6s ease;
  }
  #stage .on { opacity: 1; }
  /* Fallback: ?rotate=90 / 270 if Android itself is not rotated */
  body.rot90 #stage, body.rot270 #stage {
    width: 100vh; height: 100vw; right: auto; bottom: auto; top: 50%; left: 50%;
  }
  body.rot90 #stage { transform: translate(-50%, -50%) rotate(90deg); }
  body.rot270 #stage { transform: translate(-50%, -50%) rotate(-90deg); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const rot = params.get('rotate');
  if (rot === '90' || rot === '270') document.body.classList.add('rot' + rot);

  const stage = document.getElementById('stage');

  // ?debug=1 shows the screen size so we can check the scale on site
  if (params.get('debug') === '1') {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:12px;left:12px;z-index:9;background:#000c;color:#fff;font:600 28px/1.3 system-ui;padding:12px 16px;border-radius:8px';
    const upd = () => {
      const v = stage.querySelector('video');
      d.textContent = `Sida ${innerWidth}×${innerHeight} · pixlar ${Math.round(innerWidth*devicePixelRatio)}×${Math.round(innerHeight*devicePixelRatio)} · video ${v ? v.videoWidth + '×' + v.videoHeight : '–'}`;
    };
    document.body.appendChild(d); upd(); setInterval(upd, 1000);
  }
  let playlist = null, idx = 0, timer = null;
  let soundAllowed = params.get('mute') !== '1';
  const unlock = () => {
    if (params.get('mute') === '1') return;
    soundAllowed = true;
    stage.querySelectorAll('video').forEach(v => { v.muted = false; v.play().catch(() => {}); });
  };
  ['pointerdown', 'touchstart', 'keydown'].forEach(t => addEventListener(t, unlock, { passive: true }));

  // What to play is edited in LAAS HQ (Marketing → Store screen) and read from Supabase.
  // playlist.json next to this page is only a backup if Supabase can't be reached.
  const SB = 'https://qblwsxhryjvvjbvnggdi.supabase.co';
  const SB_KEY = 'sb_publishable_0r0degjBGfvkHe81HwWxJQ_AGJAsKOE'; // public anon key: can only read the playlist and check in
  const SCREEN = params.get('screen') || 'main';
  async function fetchPlaylist() {
    try {
      const r = await fetch(SB + '/rest/v1/screen_playlists?select=version,items&id=eq.' + encodeURIComponent(SCREEN),
        { cache: 'no-store', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } });
      if (r.ok) {
        const rows = await r.json();
        if (rows[0]) return { version: rows[0].version, checkEveryMinutes: 2, items: rows[0].items || [] };
      }
    } catch (e) {}
    const r = await fetch('playlist.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('playlist ' + r.status);
    return r.json();
  }

  // Tell HQ what is on the screen right now (so the team can see it switched).
  // Only the shop screen (Android) checks in, so a computer that opens this page
  // can't make HQ show the screen as online. ?ping=1 forces it, ?ping=0 turns it off.
  const isAndroid = /Android/.test(navigator.userAgent);
  const canPing = params.get('ping') === '1' || (isAndroid && params.get('ping') !== '0');
  let nowPlaying = '';
  function ping() {
    if (!playlist || !canPing) return;
    const v = stage.querySelector('video.on');
    const cv = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1] || '?';
    const av = (navigator.userAgent.match(/Android ([\d.]+)/) || [])[1];
    const info = (av ? 'Android ' + av + ' · ' : '') + 'Chrome ' + cv + ' · ' + innerWidth + '×' + innerHeight + ' · ' + (v ? (v.muted ? 'sound off' : 'sound on') : 'image');
    fetch(SB + '/rest/v1/rpc/screen_ping', {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_screen: SCREEN, p_version: playlist.version, p_playing: nowPlaying, p_info: info })
    }).catch(() => {});
  }
  setInterval(ping, 60000);

  // Download a media file once, keep it in the cache, return a local blob URL
  const blobUrls = {};
  async function cachedUrl(src) {
    const abs = new URL(src, location.href).href;
    if (blobUrls[abs]) return blobUrls[abs];
    try {
      const c = await caches.open('laas-screen');
      const res = await c.match(abs);
      if (!res) return null;
      return (blobUrls[abs] = URL.createObjectURL(await res.blob()));
    } catch (e) { return null; }
  }
  async function loadLocal(src) {
    const hit = await cachedUrl(src);
    if (hit) return hit;
    const abs = new URL(src, location.href).href;
    const res = await fetch(abs, { cache: 'no-store' });
    if (!res.ok) throw new Error('media ' + res.status);
    const blob = await res.blob();
    try { const c = await caches.open('laas-screen'); await c.put(abs, new Response(blob, { headers: { 'Content-Type': blob.type || 'application/octet-stream' } })); } catch (e) {}
    return (blobUrls[abs] = URL.createObjectURL(blob));
  }

  function show(i) {
    clearTimeout(timer);
    const items = playlist.items;
    if (!items.length) { stage.innerHTML = ''; nowPlaying = '(nothing)'; ping(); return; }
    const item = items[i % items.length];
    const single = items.length === 1;
    nowPlaying = item.name || item.src.split('/').pop();
    setTimeout(ping, 3000);
    let el;
    if (item.type === 'image') {
      el = new Image();
      el.onload = () => swap(el);
      loadLocal(item.src).then(u => { el.src = u; }, () => { el.src = item.src; });
      if (!single) timer = setTimeout(next, (item.seconds || 8) * 1000);
    } else {
      el = document.createElement('video');
      el.autoplay = true; el.playsInline = true;
      el.setAttribute('playsinline', '');
      el.preload = 'auto';
      el.muted = !soundAllowed || item.mute === true;
      if (single) el.loop = true; else el.onended = next;
      let triedFallback = false;
      el.onerror = () => {
        // Screen can't decode full size: use the smaller fallback
        if (item.fallback && !triedFallback) {
          triedFallback = true;
          loadLocal(item.fallback).then(u => { el.src = u; el.play().catch(() => {}); }, () => { el.src = item.fallback; });
          return;
        }
        setTimeout(() => location.reload(), 30000);
      };
      // Play from device memory (no wifi needed while playing)
      cachedUrl(item.src).then(hit => {
        if (hit) { el.src = hit; el.play().catch(() => {}); return; }
        // First time: stream the small version now, download the full one in the background
        el.src = item.fallback || item.src;
        el.play().catch(() => {});
        loadLocal(item.src).then(() => { if (playlist.items[idx % playlist.items.length] === item) show(idx); }, () => {});
      });
      let shown = false;
      const reveal = () => { if (!shown) { shown = true; swap(el); } };
      el.addEventListener('playing', reveal);
      el.addEventListener('loadeddata', reveal);
      el.play().catch(() => {
        // Browser blocked sound: play muted, unmute on first touch
        soundAllowed = false; el.muted = true; el.play().catch(() => {});
      });
    }
  }
  function swap(el) {
    const old = [...stage.children];
    stage.appendChild(el);
    setTimeout(() => el.classList.add('on'), 30);
    setTimeout(() => old.forEach(o => { if (o.pause) o.pause(); o.remove(); }), 800);
  }
  function next() { idx = (idx + 1) % playlist.items.length; show(idx); }

  // If nothing plays after 8 s, show what is wrong on the screen itself
  const status = document.createElement('div');
  status.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:9;background:rgba(0,0,0,.85);color:#fff;font:600 22px/1.4 sans-serif;padding:14px 18px;border-radius:8px;display:none';
  document.body.appendChild(status);
  setInterval(() => {
    const v = stage.querySelector('video');
    const ok = v && !v.paused && v.readyState >= 2;
    if (ok && params.get('debug') !== '1') { status.style.display = 'none'; return; }
    if (performance.now() < 8000 && params.get('debug') !== '1') return;
    const cv = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1] || '?';
    const av = (navigator.userAgent.match(/Android ([\d.]+)/) || [])[1] || '?';
    const can = document.createElement('video').canPlayType('video/mp4; codecs="avc1.64002A"') || 'nej';
    status.textContent = 'Status: ' + (!playlist ? 'ingen playlist (nät?)' : !v ? 'ingen video' :
      v.error ? 'videofel ' + v.error.code : v.paused ? 'pausad – tryck på skärmen' : ok ? 'spelar' + (v.muted ? ' (tyst)' : ' med ljud') : 'laddar (' + v.readyState + ')') +
      ' · Chrome ' + cv + ' · Android ' + av + ' · H.264 ' + can + ' · ' + innerWidth + '×' + innerHeight;
    status.style.display = 'block';
  }, 2000);

  // Watchdog: if a video freezes, restart it
  let lastT = -1, stuck = 0;
  setInterval(() => {
    const v = stage.querySelector('video.on');
    if (!v) return;
    if (v.currentTime === lastT && !v.paused) stuck++; else stuck = 0;
    lastT = v.currentTime;
    // Slow wifi: never reload the page, just nudge the video. Reload only after 10 min frozen.
    if (stuck === 6) { v.play().catch(() => {}); }
    if (stuck >= 120) location.reload();
    if (v.paused) v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
  }, 5000);

  // Remote updates: reload when playlist.json gets a new version
  async function poll() {
    try {
      const p = await fetchPlaylist();
      if (playlist && p.version !== playlist.version) {
        // Download the new files first while the old content keeps playing, then switch
        for (const it of p.items || []) { try { await loadLocal(it.src); } catch (e) {} }
        await remember(p);
        location.reload(); return;
      }
    } catch (e) { /* offline: keep playing */ }
    setTimeout(poll, ((playlist && playlist.checkEveryMinutes) || 2) * 60000);
  }

  // Keep the screen awake where supported
  async function wake() { try { await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

  // Remove cached media that is no longer in the playlist
  async function prune() {
    try {
      const c = await caches.open('laas-screen');
      const keep = new Set();
      playlist.items.forEach(i => [i.src, i.fallback].forEach(x => x && keep.add(new URL(x, location.href).href)));
      for (const req of await c.keys()) {
        if (/\.(mp4|webm|jpe?g|png|webp)$/i.test(new URL(req.url).pathname) && !keep.has(req.url)) await c.delete(req);
      }
    } catch (e) {}
  }

  // Keep the latest playlist so the screen can start without internet
  async function remember(p) {
    try { const c = await caches.open('laas-screen'); await c.put('playlist.json', new Response(JSON.stringify(p), { headers: { 'Content-Type': 'application/json' } })); } catch (e) {}
  }

  async function start() {
    try { playlist = await fetchPlaylist(); remember(playlist); }
    catch (e) {
      const c = await caches.open('laas-screen').catch(() => null);
      const hit = c && await c.match('playlist.json');
      if (!hit) { setTimeout(start, 15000); return; }
      playlist = await hit.json();
    }
    show(0);
    wake();
    prune();
    setTimeout(poll, (playlist.checkEveryMinutes || 2) * 60000);
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  start();
})();
</script>
</body>
</html>
